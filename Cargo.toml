[package]
name = "wa-sound-sticker"
version = "0.1.0"
edition = "2024"

[dependencies]
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "6f5d86748dcdaa072d6bfd7d83acc0fe9be4b1ec" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "sync"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
qrcode = { version = "0.14", default-features = false }
